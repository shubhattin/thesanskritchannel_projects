name: Data Backup

on:
  schedule:
    - cron: '30 17 */4 * *' # 11:00 PM IST every 4th day of the month (1st, 5th, 9th, ...)
  workflow_dispatch: # Allows manual triggering of the workflow

jobs:
  backup_db_data:
    runs-on: ubuntu-latest
    env:
      PG_DATABASE_URL: ${{ secrets.PG_DATABASE_URL }}
      # libpq (pg_dump) CA for sslmode=verify-full; env only — postgres.js rejects it in the URL
      PGSSLROOTCERT: system
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DB_BACKUP_BUCKET_NAME: ${{ secrets.AWS_DB_BACKUP_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync app
        working-directory: app
        run: bun run sync

      - name: Setup PostgreSQL
        uses: tj-actions/install-postgresql@v3
        with:
          postgresql-version: 18 # pg_dump must be >= the server major (PlanetScale runs 18)

      - name: Install 7-Zip
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Load Translations and DB Dump
        working-directory: app/src/db/scripts
        # The secret is a bare URL: require TLS with certificate verification for both pg_dump
        # (libpq, CA from PGSSLROOTCERT) and postgres.js (Node's CA store) unless it sets sslmode.
        run: |
          case "$PG_DATABASE_URL" in
            *sslmode=*) ;;
            *\?*) PG_DATABASE_URL="$PG_DATABASE_URL&sslmode=verify-full" ;;
            *) PG_DATABASE_URL="$PG_DATABASE_URL?sslmode=verify-full" ;;
          esac
          export PG_DATABASE_URL
          bun backup_db_data.ts

      - uses: actions/upload-artifact@v4
        with:
          name: db_backup
          path: |
            app/src/db/scripts/backup/translations.csv
            app/src/db/scripts/backup/texts.csv
            app/src/db/scripts/backup/projects.csv
            app/src/db/scripts/backup/project_paths.csv
          retention-days: 60
