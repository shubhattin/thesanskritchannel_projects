name = 'thesanskritchannel-projects'
main = '.svelte-kit/cloudflare/_worker.js'
compatibility_date = '2026-09-02'
# Effect's fiber scheduler resolves Promises from whichever request is current.
# handle_cross_request_promise_resolution (default since 2024-10-14) then drops
# those continuations and the Worker hangs. Disable it so Effect can run.
# nodejs_als: AsyncLocalStorage backs the per-request Effect runtime (hooks.server).
compatibility_flags = ['nodejs_compat', 'nodejs_als', 'no_handle_cross_request_promise_resolution']
workers_dev = false
preview_urls = false

# Preserve dashboard plaintext Variables & Secrets across deploys.
# Without this, `wrangler deploy` treats this file as source of truth and can wipe
# dashboard plaintext vars that are not listed under [vars].
# Secrets are never deleted by deploy either way; keep_vars mainly protects plaintext vars.
# Still: do NOT put real values in [vars] — those keys would overwrite dashboard values.
keep_vars = true

[placement]
region = 'aws:ap-south-1'

[assets]
binding = 'ASSETS'
directory = './.svelte-kit/cloudflare'

# Runtime env vars live in the Cloudflare dashboard only (Settings → Variables and Secrets).
# Do NOT put [vars] here — even with keep_vars, keys present in [vars] overwrite dashboard.
# See .env.example for the expected variable names.
#
# Build-time vs runtime (NOT like Vercel — two separate systems):
#   - Runtime: Settings → Variables and Secrets
#       Available to the running Worker only. keep_vars protects dashboard plaintext vars.
#   - Build:   Settings → Build → Build variables and secrets
#       Injected only into Workers Builds CI (during `bun run build`).
#       NOT readable from this toml. There is no wrangler.toml field for CI build vars.
#
# Workers Builds (configure in the Cloudflare dashboard, not here):
#   Root directory: site
#   Build command:  bun install --frozen-lockfile --cwd .. && bun run --cwd ../app sync && bun run build
#   Deploy command: bunx wrangler deploy --keep-vars
#   Non-prod:       bunx wrangler versions upload --keep-vars
# Needed envs for build :-
# BUILD_MODE=cloudflare
# BUN_VERSION=1.3
# SKIP_DEPENDENCY_INSTALL=true
# // others
# VITE_BETTER_AUTH_URL = <url>
# PUBLIC_POSTHOG_KEY="example-public-posthog-key"
# PUBLIC_POSTHOG_URL="https://us.i.posthog.com"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
