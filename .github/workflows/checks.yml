name: App Checks

on:
  push:
    paths:
      - 'app/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/checks.yml'

permissions:
  contents: read

env:
  PUBLIC_BETTER_AUTH_URL: http://localhost:3000
  PG_DATABASE_URL: postgresql://postgres:examplepassword123abc@127.0.0.1:5432/exampledb\
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: exampleaccesskey123abc
  AWS_SECRET_ACCESS_KEY: examplesecretaccesskey123abc
  AWS_S3_FILES_BUCKET_NAME: examples3bucketname123abc
  PUBLIC_AWS_CLOUDFRONT_URL: examplecloudfronturl123abc
  QSTASH_TOKEN: exampleqstashtoken123abc
  QSTASH_URL: exampleqstashurl123abc
  OPENAI_API_KEY: exampleopenaiapikey123abc
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.12.0'
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Sync SvelteKit
        working-directory: app
        run: bun run sync
      - run: |
          cd app
          bunx vitest run

  svelte_and_type_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - run: |
          cd app
          bun run check
          bun run build
