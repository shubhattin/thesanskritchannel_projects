name: Deploy Site to Vercel

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'data/**' # map changes
      - 'app/src/server/**'
      - 'app/src/state/**'
      - 'app/src/db/**'
      - 'app/src/effect/**'
      # Markdown utilities
      - 'app/src/lib/carta_markdown/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/deploy_site.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: vercel_deploy
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.12.0'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Sync app
        working-directory: app
        run: bun run sync

      - name: Install site dependencies
        working-directory: site
        run: bun install --frozen-lockfile

      - name: Pull Vercel env (production)
        working-directory: site
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_SITE_PROJECT_ID }}
        run: bunx vercel@65.9.0 env pull .env.production.local --environment=production --token="$VERCEL_TOKEN" --yes

      - name: Build (Vercel prebuilt output)
        working-directory: site
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_SITE_PROJECT_ID }}
        run: bunx vercel@65.9.0 build --prod --token="$VERCEL_TOKEN" --yes

      - name: Deploy to Vercel
        if: success()
        working-directory: site
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_SITE_PROJECT_ID }}
        run: bunx vercel@65.9.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN" --yes
