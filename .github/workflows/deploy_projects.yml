name: Deploy to Vercel

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'package.json'
      - 'bun.lock'
      - 'data/**' # sub to *_map.json changes
      - '.github/workflows/deploy_projects.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: vercel_deploy
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync app
        working-directory: app
        run: bun run sync

      - name: Pull Vercel env (production)
        working-directory: app
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: bunx vercel@65.9.0 env pull .env.production.local --environment=production --token="$VERCEL_TOKEN" --yes

      - name: Build (Vercel)
        working-directory: app
        env:
          BUILD_MODE: vercel
        run: bun run build

      - name: Deploy to Vercel
        working-directory: app
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: bunx vercel@65.9.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN" --yes
        if: success()
